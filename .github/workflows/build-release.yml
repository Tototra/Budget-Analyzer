name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller
      - name: Build .app
        run: |
          pyinstaller \
            --name BudgetAnalyzer \
            --windowed \
            --icon static/icon.icns \
            --add-data "static:static" \
            --add-data "rules.py:." \
            --add-data "ollama_classify.py:." \
            --add-data "parsers.py:." \
            --add-data "excel_export.py:." \
            --hidden-import flask \
            --hidden-import pandas \
            --hidden-import openpyxl \
            --hidden-import openpyxl.chart \
            --hidden-import openpyxl.chart.label \
            --hidden-import openpyxl.chart.marker \
            --hidden-import openpyxl.chart.shapes \
            --hidden-import openpyxl.styles \
            --hidden-import openpyxl.utils \
            --hidden-import pdfplumber \
            --hidden-import requests \
            --hidden-import webview \
            --exclude-module tkinter \
            --exclude-module matplotlib \
            --exclude-module scipy \
            --distpath dist \
            --clean -y \
            server.py
      - name: Create .dmg
        run: |
          mkdir -p dmg_content
          cp -R dist/BudgetAnalyzer.app dmg_content/
          ln -s /Applications dmg_content/Applications
          hdiutil create -volname "Budget Analyzer" -srcfolder dmg_content -ov -format UDZO dist/BudgetAnalyzer-macOS.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: BudgetAnalyzer-macOS
          path: dist/BudgetAnalyzer-macOS.dmg

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller
      - name: Build single .exe
        shell: pwsh
        run: |
          pyinstaller --name BudgetAnalyzer --onefile --windowed --icon static/icon.ico --add-data "static;static" --add-data "rules.py;." --add-data "ollama_classify.py;." --add-data "parsers.py;." --add-data "excel_export.py;." --hidden-import flask --hidden-import pandas --hidden-import openpyxl --hidden-import openpyxl.chart --hidden-import openpyxl.chart.label --hidden-import openpyxl.chart.marker --hidden-import openpyxl.chart.shapes --hidden-import openpyxl.styles --hidden-import openpyxl.utils --hidden-import pdfplumber --hidden-import requests --hidden-import webview --hidden-import clr --exclude-module tkinter --exclude-module matplotlib --exclude-module scipy --distpath dist --clean -y server.py
      - uses: actions/upload-artifact@v4
        with:
          name: BudgetAnalyzer-Windows
          path: dist/BudgetAnalyzer.exe

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgirepository1.0-dev gcc libcairo2-dev pkg-config python3-dev gir1.2-gtk-3.0 gir1.2-webkit2-4.1
      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller
      - name: Build
        run: |
          pyinstaller \
            --name BudgetAnalyzer \
            --onefile \
            --add-data "static:static" \
            --add-data "rules.py:." \
            --add-data "ollama_classify.py:." \
            --add-data "parsers.py:." \
            --add-data "excel_export.py:." \
            --hidden-import flask \
            --hidden-import pandas \
            --hidden-import openpyxl \
            --hidden-import openpyxl.chart \
            --hidden-import openpyxl.chart.label \
            --hidden-import openpyxl.chart.marker \
            --hidden-import openpyxl.chart.shapes \
            --hidden-import openpyxl.styles \
            --hidden-import openpyxl.utils \
            --hidden-import pdfplumber \
            --hidden-import requests \
            --hidden-import webview \
            --exclude-module tkinter \
            --exclude-module matplotlib \
            --exclude-module scipy \
            --distpath dist \
            --clean -y \
            server.py
      - uses: actions/upload-artifact@v4
        with:
          name: BudgetAnalyzer-Linux
          path: dist/BudgetAnalyzer

  release:
    needs: [build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Upload to Release (tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/BudgetAnalyzer-macOS/BudgetAnalyzer-macOS.dmg
            artifacts/BudgetAnalyzer-Windows/BudgetAnalyzer.exe
            artifacts/BudgetAnalyzer-Linux/BudgetAnalyzer

      - name: Upload to Release (manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: Budget Analyzer v1.0.0
          files: |
            artifacts/BudgetAnalyzer-macOS/BudgetAnalyzer-macOS.dmg
            artifacts/BudgetAnalyzer-Windows/BudgetAnalyzer.exe
            artifacts/BudgetAnalyzer-Linux/BudgetAnalyzer
